[package]
name = "woff2"
version = "0.3.0"
authors = ["Brian Hanechak <brianh@cimpress.com>", "Emily Crandall Fleischman <emily.fleischman@cimpress.com>"]
edition = "2021"
license = "Apache-2.0"
keywords = ["woff2", "font", "parse"]
description = "WOFF2 decompression library"
repository = "https://github.com/Cimpress-MCP/woff2-rs"
readme = "readme.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Dependencies taken from https://github.com/Cimpress-MCP/woff2-rs/compare/main...yisibl:woff2-rs:fix-total-compressed-size,
# and pinned.
[dependencies]
brotli = { version = "=3.3.4", default-features = false, features = ["std"] }
bytes = "1.10.0"
four-cc = "0.4.0"
safer-bytes = "0.2.0"
thiserror = "1.0.63"
bitvec = "1.0.1"
ttf-parser = ">=0.7.0, <=0.17.0"

[dev-dependencies]
clap = { version = "4.5.32", features = ["derive"] }