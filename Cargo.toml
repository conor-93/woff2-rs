[package]
name = "woff2"
version = "0.3.0"
authors = ["Brian Hanechak <brianh@cimpress.com>", "Emily Crandall Fleischman <emily.fleischman@cimpress.com>"]
edition = "2021"
license = "Apache-2.0"
keywords = ["woff2", "font", "parse"]
description = "WOFF2 decompression library"
repository = "https://github.com/Cimpress-MCP/woff2-rs"
readme = "readme.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Dependencies taken from https://github.com/Cimpress-MCP/woff2-rs/compare/main...yisibl:woff2-rs:fix-total-compressed-size,
# and pinned.
[dependencies]
brotli = { version = "=3.3.4", default-features = false, features = ["std"] }
bytes = "=1.4.0"
four-cc = "=0.3.0"
safer-bytes = "=0.2.0"
thiserror = "=1.0.44"
bitvec = "=1.0.1"
clap = { version = "=3.1.6", features = ["derive"] }
clap_derive = "=3.1.7"
ttf-parser = "=0.15.0"
walkdir = "2.5.0"

# WASM only
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["Window", "Performance", "console"] }

[lib]
# Produce both a normal Rust library (rlib) for native usage
# and a cdylib for WASM usage via wasm-bindgen.
crate-type = ["rlib", "cdylib"]
name = "woff2"

[[bin]]
name = "woff2-rs-android-benchmark"
path = "src/bin/android_benchmark.rs"