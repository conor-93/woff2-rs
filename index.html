<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOFF2 to TTF WASM Benchmark</title>
</head>
<body>
<h1>WOFF2 to TTF Converter</h1>
<input type="file" id="fileInput" multiple>
<script type="module">
  import init, { convert_woff2_wasm } from "./pkg/woff2.js";

  async function runBenchmark() {
    await init();

    document.getElementById("fileInput").addEventListener("change", async (event) => {
      const files = event.target.files;

      for (const file of files) {
        if (!file.name.endsWith(".woff2")) continue;

        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        console.log(`Processing ${file.name}...`);
        const outputSize = convert_woff2_wasm(uint8Array);

        console.log(`${file.name} -> Output size: ${outputSize} bytes`);
      }
    });
  }

  runBenchmark();
</script>
</body>
</html>
